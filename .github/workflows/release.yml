name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arch-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Arch package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$PWD/dist:/out" \
            archlinux:base-devel \
            bash -euo pipefail -c "
              pacman -Syu --noconfirm --needed base-devel git meson ninja \
                gtk3 libxfce4ui vte3 xfconf desktop-file-utils
              useradd -m builder
              cp -a /repo /work
              rm -rf /work/.git
              sed -i 's/^pkgver=.*/pkgver=${version}/' /work/packaging/PKGBUILD
              chown -R builder /work
              su builder -c 'cd /work && makepkg -f --nodeps --noconfirm -p packaging/PKGBUILD'
              cp /work/*.pkg.tar.zst /out/
            "

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pkg.tar.zst
          generate_release_notes: true
